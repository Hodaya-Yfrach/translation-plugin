# מזהה ייחודי: Windows מזהה לפיו את ההתקנה, וכך עדכון מחליף את הגרסה הקיימת ולא מתקין עותק נוסף
appId: com.imreykodesh.fasttranslate
productName: translation-plugin
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
win:
  executableName: translation-plugin
nsis:
  # שם באנגלית בלבד: הקובץ עולה לאתר, ו-v<גרסה> בשם הוא הפורמט של generate-downloads.js באתר
  artifactName: FastTranslate-Setup-v${version}.${ext}
  # התקנה בלחיצה אחת למשתמש הנוכחי, בלי הרשאות מנהל: כך העדכון מותקן בשקט מתוך התוכנה
  oneClick: true
  perMachine: false
  shortcutName: FastTranslate AI
  uninstallDisplayName: FastTranslate AI
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# מקור העדכונים (src/main/updater.ts): אתר אמרי קודש, דרך הדומיין של R2 (המתקין גדול מ-24MB של Cloudflare Pages).
# scripts/publish-update.ps1 מעלה לשם את המתקין, את ה-blockmap ואת latest.yml.
publish:
  provider: generic
  url: https://downloads.imreykodesh.com/downloads/fasttranslate
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/